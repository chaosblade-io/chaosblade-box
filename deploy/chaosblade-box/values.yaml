# Default values for chaosblade-box.
box:
  repository: ghcr.io/chaosblade-io/chaosblade-box
  version: 1.1.0
  pullPolicy: IfNotPresent

mysql:
  # If true, use the built-in MySQL. Otherwise, an external MySQL is required,
  # and must edit the spring.datasource to your external MySQL.
  enable: true
  image:
    repository: mysql
    version: 5.6
    pullPolicy: IfNotPresent
spring:
  datasource:
    url: jdbc:mysql://chaosblade-box-mysql:3306/chaosblade?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password:
  redis:
    # Redis host configuration
    # For Redis in Kubernetes cluster, use the Service name (e.g., 'redis' or 'chaosblade-box-redis')
    # For external Redis, use the external address
    # Note: 'localhost' may cause issues in Kubernetes, use Service name or IP address instead
    host: localhost
    port: 6379
    password:
    database: 0
chaos:
  agent:
    version: 1.1.0
    repository: ghcr.io/chaosblade-io/chaosblade-box-agent
    url: https://chaosblade.oss-cn-hangzhou.aliyuncs.com/platform/release/1.1.0/chaosagent-1.1.0-linux_amd64.tar.gz
    url-arm64: https://chaosblade.oss-cn-hangzhou.aliyuncs.com/platform/release/1.1.0/chaosagent-1.1.0-linux_arm64.tar.gz
    helm: https://chaosblade.oss-cn-hangzhou.aliyuncs.com/platform/release/1.1.0/chaosblade-box-agent-1.1.0-helm_amd64.tgz
    helm-arm64: https://chaosblade.oss-cn-hangzhou.aliyuncs.com/platform/release/1.1.0/chaosblade-box-agent-1.1.0-helm_arm64.tgz
  function:
    sync:
      type: ALL
  prometheus:
    api:
logging:
  level:
    root: info
    box: info

