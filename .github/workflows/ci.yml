# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least-privilege default token for all CI jobs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['8']
    name: Build with JDK ${{ matrix.java-version }}

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: Check License Header
        uses: korandoru/hawkeye@7ffde2c5fd29f3c486e4a6510436dca54f386e2a # v6
      - name: Run code style verification
        run: mvn spotless:check
      - name: Build with Maven
        run: mvn clean package -Dmaven.test.skip=true -U

  ci-gate:
    name: CI Gate
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    env:
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Require the build to pass
        run: |
          echo "build=$BUILD_RESULT"
          fail=0
          if [ "$BUILD_RESULT" != "success" ]; then
            fail=1
            if [ "$BUILD_RESULT" = "cancelled" ]; then
              echo "::error::build was cancelled"
            elif [ "$BUILD_RESULT" = "skipped" ]; then
              echo "::error::build was skipped (no path filters exist; expected to always run)"
            else
              echo "::error::build did not succeed (result=$BUILD_RESULT)"
            fi
          fi
          exit $fail
