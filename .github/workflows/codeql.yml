name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly scan of the default branch so code-scanning stays fresh.
    - cron: '30 1 * * 1'

# Least-privilege default; the analyze job elevates only what CodeQL needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload SARIF results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This project only builds on JDK 8 (lombok 1.18.10 and aspectjweaver
      # 1.8.13 break on newer JDKs), so CodeQL must not use autobuild, which
      # would pick the runner's default JDK. The build is driven manually with
      # the same command ci.yml uses.
      - name: Set up JDK 8
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build with Maven
        run: mvn clean package -Dmaven.test.skip=true -U

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:java-kotlin"
