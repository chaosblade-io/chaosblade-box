version: 2
updates:
  # Keeps the commit-SHA pinned GitHub Actions up to date. Pinning by hash
  # without an update tool would otherwise freeze the workflow dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Dockerfile base image is referenced by tag, not by digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
